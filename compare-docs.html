<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文献并排比较与批注</title>
<style>
  :root{--bg:#f4efe6;--panel:#fffdf8;--ink:#1b1814;--dim:#6e675d;--line:#ddd5c7;--red:#a8342a;--gold:#c9a262}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
  a{color:var(--red);text-decoration:none}
  header{padding:18px 26px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:18px}
  h1 span{color:var(--red)}
  .sub{color:var(--dim);font-size:12.5px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 26px;border-bottom:1px solid var(--line);background:var(--panel)}
  .toolbar label{font-size:12.5px;color:var(--dim)}
  select,button{font:inherit;font-size:13px;padding:5px 9px;border:1px solid var(--line);border-radius:4px;background:#fff;color:inherit;cursor:pointer}
  button:hover{border-color:var(--red);color:var(--red)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 26px 26px}
  @media(max-width:900px){.pair{grid-template-columns:1fr}}
  .doc{border:1px solid var(--line);border-radius:5px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column}
  .doc header{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  .doc header h2{margin:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .doc header span{font-size:11.5px;color:var(--dim)}
  .viewport{position:relative;height:min(62vh,620px);overflow:hidden;background:#efe9dd;cursor:crosshair}
  .viewport img{position:absolute;left:0;top:0;width:100%;height:auto;transform-origin:0 0;will-change:transform;user-select:none}
  .pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
    background:rgba(168,52,42,.9);color:#fff;font-size:11.5px;line-height:22px;text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;z-index:3}
  .pin:hover{background:#c8453c}
  .doc footer{padding:8px 12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
  .notes{padding:0 26px 40px}
  .notes h3{margin:6px 0 10px;font-size:13px;color:var(--dim);font-weight:500;letter-spacing:.08em}
  .note{display:flex;gap:10px;align-items:baseline;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;margin-bottom:7px;font-size:13px}
  .note b{color:var(--red);font-weight:600;white-space:nowrap}
  .note small{color:var(--dim);font-size:11.5px;white-space:nowrap}
  .note button{margin-left:auto;font-size:11.5px;padding:2px 7px}
  .empty{padding:24px;color:var(--dim);font-size:13px;text-align:center}
</style>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/ui-v3.css?v=2">
<link rel="stylesheet" href="css/unify.css?v=1">
<link rel="stylesheet" href="css/ref-sd.css"></head>
<body>
<header>
  <h1>文献并排比较 <span>·</span> 批注</h1>
  <div class="sub">两册并排、缩放同步、可落点批注｜<a href="reader.html">文献阅读室</a>｜<a href="index.html">主展馆</a></div>
</header>

<div class="toolbar">
  <label>左：<select id="sel-a"></select></label>
  <label>右：<select id="sel-b"></select></label>
  <button id="sync" type="button" aria-pressed="true">缩放同步：开</button>
  <button id="btn-out" type="button">−</button>
  <span id="zoom" style="font-size:12.5px;color:var(--dim);min-width:52px;text-align:center">100%</span>
  <button id="btn-in" type="button">＋</button>
  <button id="btn-reset" type="button">复位</button>
  <button id="btn-export" type="button">导出批注 JSON</button>
</div>

<div class="pair">
  <section class="doc">
    <header><h2 id="title-a">左</h2><span id="page-a">1 / 3</span></header>
    <div class="viewport" id="view-a"><img id="img-a" alt=""></div>
    <footer><button data-prev="a" type="button">← 上一页</button><button data-next="a" type="button">下一页 →</button><span id="hint-a">点图上任意位置落批注</span></footer>
  </section>
  <section class="doc">
    <header><h2 id="title-b">右</h2><span id="page-b">1 / 3</span></header>
    <div class="viewport" id="view-b"><img id="img-b" alt=""></div>
    <footer><button data-prev="b" type="button">← 上一页</button><button data-next="b" type="button">下一页 →</button><span id="hint-b">点图上任意位置落批注</span></footer>
  </section>
</div>

<div class="notes">
  <h3>批注 · <span id="count">0</span> 条（存在本机浏览器，不上传）</h3>
  <div id="list"><div class="empty">还没有批注。点任一页面的任意位置即可添加。</div></div>
</div>

<script>
(function(){
  "use strict";
  var DOCS = [], state = { a: { doc: 0, page: 0, zoom: 1, x: 0, y: 0 }, b: { doc: 1, page: 0, zoom: 1, x: 0, y: 0 } };
  var sync = true, notes = [];
  var KEY = "xinghuo.docnotes.v1";

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function loadNotes(){
    try { notes = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { notes = []; }
    if(!Array.isArray(notes)) notes = [];
  }
  function saveNotes(){
    try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch(e) {}
  }

  function apply(side){
    var s = state[side], doc = DOCS[s.doc];
    if(!doc) return;
    var img = document.getElementById("img-" + side);
    img.src = doc.pages[s.page];
    var vp = document.getElementById("view-" + side);
    img.onload = function(){
      img.style.transform = "translate(" + s.x + "px," + s.y + "px) scale(" + s.zoom + ")";
    };
    document.getElementById("title-" + side).textContent = doc.title;
    document.getElementById("page-" + side).textContent = (s.page + 1) + " / " + doc.pages.length;
    drawPins(side);
  }

  function drawPins(side){
    var vp = document.getElementById("view-" + side);
    Array.prototype.forEach.call(vp.querySelectorAll(".pin"), function(p){ p.remove(); });
    var s = state[side], doc = DOCS[s.doc];
    if(!doc) return;
    notes.filter(function(n){ return n.side === side && n.doc === doc.id && n.page === s.page; })
      .forEach(function(n, i){
        var pin = document.createElement("div");
        pin.className = "pin";
        pin.style.left = (n.u * 100) + "%";
        pin.style.top = (n.v * 100) + "%";
        pin.textContent = String(i + 1);
        pin.title = n.text;
        pin.onclick = function(ev){ ev.stopPropagation(); prompt("修改批注（留空可删除）", n.text) === null ? null : editNote(n); };
        vp.appendChild(pin);
      });
  }

  function editNote(n){
    var t = prompt("修改批注（留空可删除）", n.text);
    if(t === null) return;
    if(!t.trim()){ notes = notes.filter(function(x){ return x !== n; }); }
    else n.text = t.trim();
    saveNotes(); renderNotes(); drawPins(n.side);
  }

  function addNote(side, ev){
    var vp = document.getElementById("view-" + side);
    var r = vp.getBoundingClientRect();
    var u = (ev.clientX - r.left) / r.width, v = (ev.clientY - r.top) / r.height;
    var s = state[side], doc = DOCS[s.doc];
    if(!doc) return;
    var text = prompt("这一处写什么？（例如：此页「幽灵」译法与 1888 英译不同）");
    if(!text || !text.trim()) return;
    notes.push({ side: side, doc: doc.id, title: doc.title, page: s.page, u: u, v: v,
                 text: text.trim(), at: new Date().toISOString() });
    saveNotes(); renderNotes(); drawPins(side);
  }

  function renderNotes(){
    var list = document.getElementById("list");
    document.getElementById("count").textContent = String(notes.length);
    if(!notes.length){ list.innerHTML = '<div class="empty">还没有批注。点任一页面的任意位置即可添加。</div>'; return; }
    list.innerHTML = notes.map(function(n, i){
      return '<div class="note"><b>' + (i+1) + "</b><span>" + esc(n.text) + "</span>" +
        "<small>" + esc(n.title) + " · 第 " + (n.page+1) + " 页</small>" +
        '<button type="button" data-del="' + i + '">删除</button></div>';
    }).join("");
    Array.prototype.forEach.call(list.querySelectorAll("[data-del]"), function(b){
      b.onclick = function(){
        var i = Number(b.getAttribute("data-del"));
        var n = notes[i];
        notes.splice(i, 1);
        saveNotes(); renderNotes();
        if(n) drawPins(n.side);
      };
    });
  }

  function setZoom(z){
    z = Math.min(4, Math.max(1, z));
    state.a.zoom = z;
    if(sync) state.b.zoom = z;
    ["a","b"].forEach(function(side){
      var img = document.getElementById("img-" + side);
      if(img) img.style.transform = "translate(" + state[side].x + "px," + state[side].y + "px) scale(" + state[side].zoom + ")";
    });
    document.getElementById("zoom").textContent = Math.round(z * 100) + "%";
  }

  function buildSelects(){
    ["a","b"].forEach(function(side){
      var sel = document.getElementById("sel-" + side);
      sel.innerHTML = DOCS.map(function(d, i){ return '<option value="' + i + '">' + esc(d.title) + "</option>"; }).join("");
      sel.value = String(state[side].doc);
      sel.onchange = function(){ state[side].doc = Number(sel.value); state[side].page = 0; apply(side); };
    });
  }

  function bind(){
    ["a","b"].forEach(function(side){
      document.getElementById("view-" + side).addEventListener("click", function(ev){
        if(ev.target.classList.contains("pin")) return;
        addNote(side, ev);
      });
      document.querySelector('[data-prev="' + side + '"]').onclick = function(){
        var s = state[side];
        if(s.page > 0){ s.page--; apply(side); }
      };
      document.querySelector('[data-next="' + side + '"]').onclick = function(){
        var s = state[side], doc = DOCS[s.doc];
        if(doc && s.page < doc.pages.length - 1){ s.page++; apply(side); }
      };
    });
    document.getElementById("btn-in").onclick = function(){ setZoom(state.a.zoom + 0.25); };
    document.getElementById("btn-out").onclick = function(){ setZoom(state.a.zoom - 0.25); };
    document.getElementById("btn-reset").onclick = function(){ state.a.x = state.a.y = state.b.x = state.b.y = 0; setZoom(1); };
    document.getElementById("sync").onclick = function(){
      sync = !sync;
      this.textContent = "缩放同步：" + (sync ? "开" : "关");
      this.setAttribute("aria-pressed", String(sync));
      if(sync) setZoom(state.a.zoom);
    };
    document.getElementById("btn-export").onclick = function(){
      var blob = new Blob([JSON.stringify(notes, null, 1)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "批注.json";
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    };
  }

  loadNotes();
  fetch("assets/manifests/pages.json").then(function(r){ return r.json(); }).then(function(d){
    DOCS = d.items || [];
    if(DOCS.length < 2){ document.querySelector(".pair").innerHTML = '<div class="empty">可比较的文献不足两册</div>'; return; }
    var q = new URLSearchParams(location.search);
    if(q.get("a")){ DOCS.forEach(function(x,i){ if(x.id === q.get("a")) state.a.doc = i; }); }
    if(q.get("b")){ DOCS.forEach(function(x,i){ if(x.id === q.get("b")) state.b.doc = i; }); }
    if(state.b.doc === state.a.doc) state.b.doc = (state.a.doc + 1) % DOCS.length;
    buildSelects(); bind(); apply("a"); apply("b"); renderNotes(); setZoom(1);
  }).catch(function(e){
    document.querySelector(".pair").innerHTML = '<div class="empty">pages.json 加载失败：' + esc(e.message) + "</div>";
  });
})();
</script>
<script src="js/ui-chrome.js?v=2"></script>
<script src="js/back.js?v=1"></script>
</body>
</html>
