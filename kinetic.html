<style>
  :root{--ink:#f2e9d8;--gold:#c9a262;--red:#a8332c;--bg:#0a0908}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:15px/1.6 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .grain{position:fixed;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 38%,rgba(6,5,4,.72) 100%);
    mix-blend-mode:multiply}
  .grain::after{content:"";position:absolute;inset:0;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='0.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .top{position:absolute;top:0;left:0;right:0;padding:22px 30px;display:flex;justify-content:space-between;align-items:flex-start;
    background:linear-gradient(180deg,rgba(10,9,8,.92),rgba(10,9,8,0));pointer-events:none}
  .brand{font-size:13px;letter-spacing:.22em;color:var(--gold)}
  .brand b{display:block;font-size:26px;letter-spacing:.06em;color:var(--ink);margin-top:6px;font-weight:600}
  .counts{display:flex;gap:20px;text-align:right;margin-left:auto}
  .counts div{font-size:11px;letter-spacing:.14em;color:#8d8175}
  .counts span{display:block;font-size:26px;color:var(--gold);letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .bottom{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(10,9,8,.94),rgba(10,9,8,0));pointer-events:none}
  .card{position:absolute;left:30px;bottom:96px;max-width:min(520px,52vw);padding:16px 20px;border-left:2px solid var(--red);
    background:rgba(12,10,9,.82);backdrop-filter:blur(6px);opacity:0;transform:translateY(10px);transition:.35s}
  .card.on{opacity:1;transform:none}
  .card h3{margin:0 0 8px;font-size:17px;font-weight:600}
  .card p{margin:0;font-size:12.5px;color:#a89c8c;line-height:1.7}
  .card .lic{color:var(--gold);margin-top:6px}
  .hint{position:absolute;right:30px;bottom:96px;font-size:11.5px;letter-spacing:.14em;color:#7d7264;text-align:right}
  .filters{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:6;display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:min(560px,44vw)}
  .filters button{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(201,162,98,.28);background:rgba(18,15,13,.72);color:#bfae97;letter-spacing:.06em;
    backdrop-filter:blur(6px);transition:.2s}
  .filters button:hover{color:#f2e9d8;border-color:rgba(201,162,98,.6)}
  .filters button.on{background:#a8332c;border-color:#a8332c;color:#fff}
  .strip{height:104px;overflow:hidden;position:relative;border-top:1px solid rgba(201,162,98,.16);pointer-events:auto}
  .track{display:flex;gap:8px;position:absolute;top:12px;left:0;will-change:transform}
  .track img{width:68px;height:68px;object-fit:cover;filter:grayscale(.35) brightness(.8);transition:.3s;border:1px solid rgba(201,162,98,.18)}
  .track img:hover{filter:none;transform:scale(1.9);z-index:3;border-color:var(--gold)}
  .strip-label{position:absolute;right:14px;bottom:6px;font-size:10.5px;letter-spacing:.18em;color:#6f6558}
  .reader{position:fixed;inset:0;background:rgba(6,5,4,.96);z-index:9000;display:none;
    grid-template-rows:1fr auto;padding:26px 30px 18px}
  .reader.on{display:grid}
  .reader .stageimg{display:grid;place-items:center;overflow:hidden}
  .reader img{max-width:min(1500px,94vw);max-height:76vh;object-fit:contain;
    box-shadow:0 24px 70px rgba(0,0,0,.7);background:#0f0d0b}
  .reader .bar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:14px;border-top:1px solid rgba(201,162,98,.18)}
  .reader .cap{font-size:13px;color:#cbbfae;max-width:70vw;line-height:1.6}
  .reader .cap b{color:#f2e9d8;display:block;font-size:15px;margin-bottom:4px}
  .reader .nav{display:flex;gap:8px}
  .reader .nav button{font:inherit;font-size:13px;padding:8px 16px;border-radius:4px;cursor:pointer;
    border:1px solid rgba(201,162,98,.4);background:transparent;color:#d8cbb8}
  .reader .nav button:hover{background:rgba(201,162,98,.14);color:#fff}
  .reader .x{position:absolute;right:26px;top:18px;font-size:30px;line-height:1;background:none;border:0;
    color:#bfae97;cursor:pointer}
  .back{position:fixed;left:30px;top:26px;z-index:6;font-size:12px;color:#8d8175;text-decoration:none;letter-spacing:.1em}
  .back:hover{color:var(--gold)}
  @media(max-width:820px){.counts{gap:14px}.counts span{font-size:18px}.brand b{font-size:18px}}

  /* 打开单图后的详细解释面板 */
  .det-head{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
  .det-place{font-size:11px;letter-spacing:.16em;color:#c9a262}
  .det-era{font-size:11px;letter-spacing:.10em;color:#7d6d55}
  .det h3{margin:0 0 8px;font-size:17px;line-height:1.4}
  .det-lead{margin:0 0 12px;font-size:13.5px;line-height:1.8;color:#cfc3b0}
  .det-sec{margin:0 0 11px}
  .det-sec b{display:block;font-size:11px;letter-spacing:.14em;color:#8a5f0e;margin-bottom:4px;font-weight:500}
  .det-sec p{margin:0;font-size:12.5px;line-height:1.78;color:#b8ac99}
  .det-rel{margin:14px 0 10px}
  .det-rel b{display:block;font-size:11px;letter-spacing:.14em;color:#8a5f0e;margin-bottom:7px;font-weight:500}
  .det-thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .det-thumbs button{padding:0;border:1px solid rgba(201,162,98,.25);background:none;cursor:pointer;
    border-radius:3px;overflow:hidden;text-align:left}
  .det-thumbs button:hover{border-color:#c9a262}
  .det-thumbs img{display:block;width:100%;height:62px;object-fit:cover}
  .det-thumbs span{display:block;font-size:9.5px;color:#8d8175;padding:3px 4px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .det-src{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:10px;
    border-top:1px solid rgba(201,162,98,.16);font-size:11px;color:#6f6558}
  .det-src a{color:#c9a262}

  /* 阅读层：图在上，解释在下，解释区可滚动 */
  #readerCap.det{max-height:38vh;overflow:auto;text-align:left;max-width:min(1100px,92vw)}
  #readerCap.det .det-thumbs img{height:54px}

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

(function(){
  "use strict";
  var stage = document.getElementById("stage");
  var card = document.getElementById("card");
  var renderer, scene, camera, ring, clock, composer, bloom;
  var planes = [], items = [], focus = -1;
  var rot = { ang: 0, vel: 0.045, drag: false, lastX: 0, z: 1, zTarget: 1 };
  var COUNT = { images: 0, models: 0, docs: 0, assets: 0 };

  var GROUP_ORDER = ["形象与雕像", "文献与版本", "场景绘画", "场地与旧址", "工厂与罢工", "革命与组织", "馆藏艺术品", "其他"];

  function ease(t){ return 1 - Math.pow(1 - t, 3); }
  function animateCount(el, to, dur){
    var start = performance.now();
    (function tick(now){
      var p = Math.min(1, (now - start) / dur);
      el.textContent = Math.round(to * ease(p)).toLocaleString();
      if (p < 1) requestAnimationFrame(tick);
    })(performance.now());
  }

  function init(){
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x0a0908, 1);
    if ("outputColorSpace" in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;
    else if ("outputEncoding" in renderer) renderer.outputEncoding = THREE.sRGBEncoding;
    stage.appendChild(renderer.domElement);


    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0908, 0.006);
    camera = new THREE.PerspectiveCamera(74, innerWidth/innerHeight, 0.05, 400);
    camera.position.set(0, 0, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    var key = new THREE.DirectionalLight(0xffe6bd, 1.1); key.position.set(3, 5, 2); scene.add(key);
    var rim = new THREE.DirectionalLight(0x8fb0c8, 0.5); rim.position.set(-4, -2, -3); scene.add(rim);

    ring = new THREE.Group();
    scene.add(ring);

    /* 星尘：2000 个缓慢漂移的点，给纵深和呼吸感 */
    var starGeo = new THREE.BufferGeometry();
    var sp = [];
    for (var s = 0; s < 2000; s++) {
      var rr = 6 + Math.random() * 40;
      var th = Math.random() * Math.PI * 2;
      var ph = Math.acos(2 * Math.random() - 1);
      sp.push(rr * Math.sin(ph) * Math.cos(th), rr * Math.cos(ph) * 0.6, rr * Math.sin(ph) * Math.sin(th));
    }
    starGeo.setAttribute("position", new THREE.Float32BufferAttribute(sp, 3));
    var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      color: 0xd9c39a, size: 0.055, transparent: true, opacity: 0.55,
      depthWrite: false, blending: THREE.AdditiveBlending
    }));
    scene.add(stars);
    window.__stars = stars;


    /* 后处理：轻微泛光，让发光节点与环境光有厚度 */
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.55, 0.90);
    composer.addPass(bloom);

    clock = new THREE.Clock();
    bindInput();
    animate();
  }

  /* 用 TextureLoader 直接加载图片，避免 canvas 中转在部分环境下不触发 onload */
  var texLoader = new THREE.TextureLoader();
  texLoader.setCrossOrigin("anonymous");
  var texCache = {};
  function makeTexture(src, cb){
    if (texCache[src]) { cb(texCache[src].tex, texCache[src].aspect); return; }
    texLoader.load(src, function(tex){
      tex.anisotropy = 2;
      if ("colorSpace" in tex && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      tex.minFilter = THREE.LinearFilter;
      tex.generateMipmaps = false;
      var img = tex.image || { width: 1, height: 1 };
      var aspect = (img.width && img.height) ? img.width / img.height : 0.75;
      texCache[src] = { tex: tex, aspect: aspect };
      cb(tex, aspect);
    }, undefined, function(){ cb(null, 0.75); });
  }

  function buildRing(data){
    items = data.items || [];
    /* 环上最多 140 张：均匀抽样，保证每类都有代表；全部 326 张在阅读层与史料墙可查 */
    var MAX_RING = 140;
    var ringList = items;
    if (items.length > MAX_RING) {
      ringList = [];
      var step = items.length / MAX_RING;
      for (var k = 0; k < MAX_RING; k++) {
        ringList.push({ item: items[Math.floor(k * step)], idx: Math.floor(k * step) });
      }
      ringList = ringList.map(function (o) { return o.item; });
      window.__ringIdx = (function () {
        var list = [];
        for (var k = 0; k < MAX_RING; k++) list.push(Math.floor(k * step));
        return list;
      })();
    } else {
      window.__ringIdx = items.map(function (_, i) { return i; });
    }
    var n = ringList.length || 1;
    var radius = Math.max(10, n * 0.085);
    var geo = new THREE.PlaneGeometry(1, 1);

    ringList.forEach(function(it, i){
      var ang = (i / n) * Math.PI * 2;
      // 双圈交错，制造纵深
      var r = radius * (i % 2 ? 1.14 : 1.0);
      var y = (i % 2 ? 1.05 : -1.05) + Math.sin(i * 1.7) * 0.35;
      var mat = new THREE.MeshStandardMaterial({
        color: 0x3a3630, roughness: 0.92, metalness: 0.04,
        side: THREE.DoubleSide, transparent: true, opacity: 0.96
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(Math.sin(ang) * r, y, Math.cos(ang) * r);
      mesh.lookAt(0, y, 0);
      mesh.userData = { index: (window.__ringIdx ? window.__ringIdx[i] : i), item: it, baseY: y };
      ring.add(mesh);
      planes.push(mesh);

      makeTexture(it.ring || it.src, function(tex, aspect){
        if (!tex) return;
        /* 同一分类用同一基准高度，组内只做微差，避免高低凌乱 */
        var groupIdx = Math.max(0, GROUP_ORDER.indexOf(it.group || "其他"));
        var h = 3.1 + groupIdx * 0.12 + (i % 3) * 0.08;
        var w = h * Math.min(aspect, 1.4);
        mesh.scale.set(w, h, 1);
        mat.map = tex;
        mat.color.setHex(0xffffff);
        mat.needsUpdate = true;
      });
    });

    // 地平线与光晕
    var disc = new THREE.Mesh(
      new THREE.RingGeometry(radius * 1.28, radius * 1.30, 160),
      new THREE.MeshBasicMaterial({ color: 0xc9a262, transparent: true, opacity: 0.18, side: THREE.DoubleSide })
    );
    disc.rotation.x = -Math.PI / 2;
    ring.add(disc);

    ring.userData.radius = radius;
    window.__ringRadius = radius;
  }

  function bindInput(){
    var el = renderer.domElement;
    var mouse = { x: 0, y: 0 };
    window.addEventListener("pointermove", function (e) {
      mouse.x = (e.clientX / innerWidth) * 2 - 1;
      mouse.y = (e.clientY / innerHeight) * 2 - 1;
      rot.mx = mouse.x; rot.my = mouse.y;
    });
    el.addEventListener("pointerdown", function(e){ rot.drag = true; rot.lastX = e.clientX; el.setPointerCapture(e.pointerId); });
    el.addEventListener("pointerup", function(e){ rot.drag = false; });
    el.addEventListener("pointermove", function(e){
      if (!rot.drag) return;
      var dx = e.clientX - rot.lastX;
      rot.lastX = e.clientX;
      rot.ang -= dx * 0.0035;
      rot.vel = -dx * 0.0015;
    });
    var zoomLabel = null, zoomTimer = 0;
    function showZoomLabel() {
      if (!zoomLabel) {
        zoomLabel = document.createElement("div");
        zoomLabel.id = "zoomLabel";
        zoomLabel.style.cssText = "position:fixed;right:26px;bottom:120px;z-index:60;font:12px/1 ui-monospace,monospace;" +
          "letter-spacing:.1em;color:#c9a262;background:rgba(10,9,8,.7);border:1px solid rgba(201,162,98,.3);" +
          "padding:6px 10px;border-radius:999px;opacity:0;transition:opacity .25s";
        document.body.appendChild(zoomLabel);
      }
      zoomLabel.textContent = (rot.z < 0.9 ? "近 " : rot.z > 1.15 ? "远 " : "标准 ") + rot.z.toFixed(2) + "×";
      zoomLabel.style.opacity = "1";
      clearTimeout(zoomTimer);
      zoomTimer = setTimeout(function () { zoomLabel.style.opacity = "0"; }, 900);
    }

    var zoomHold = 0;
    window.addEventListener("wheel", function(e){
      if (document.body.classList.contains("reader-open")) return;
      if (e.target.closest && e.target.closest(".reader, .uibar, .ub-panel, input, textarea, select")) return;
      e.preventDefault();
      var d = Math.max(-120, Math.min(120, e.deltaY));
      var k = Math.exp(d * 0.0012);
      rot.zTarget = Math.max(0.32, Math.min(9, rot.zTarget * k));
      rot.lastUser = Date.now();
      rot.vel *= 0.55;
      zoomHold = Date.now() + 550; window.__zoomHoldUntil = zoomHold;
      showZoomLabel();
    }, { passive: false });

    /* 双指缩放（触控板/触屏） */
    el.addEventListener("gesturestart", function(e){ e.preventDefault(); }, { passive: false });
    var pinch = 0;
    el.addEventListener("touchstart", function(e){
      if (e.touches.length === 2) {
        pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
      }
    }, { passive: true });
    el.addEventListener("touchmove", function(e){
      if (e.touches.length === 2 && pinch) {
        var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                           e.touches[0].clientY - e.touches[1].clientY);
        rot.zTarget = Math.max(0.18, Math.min(9, rot.zTarget * (pinch / d)));
        pinch = d;
      }
    }, { passive: true });

    /* 键盘：+/- 远近，0 复位 */
    window.addEventListener("keydown", function(e){
      if (document.getElementById("reader").classList.contains("on")) return;
      if (e.key === "+" || e.key === "=") rot.zTarget = Math.min(9, rot.zTarget * 1.18);
      if (e.key === "-" || e.key === "_") rot.zTarget = Math.max(0.18, rot.zTarget / 1.18);
      if (e.key === "0") { rot.zTarget = 1; rot.ang = 0; }
    });

    var down = null;
    el.addEventListener("click", function(e){
      var hit = pick(e.clientX, e.clientY);
      if (hit >= 0) openReader(hit); else clearFocus();
    });
    window.addEventListener("keydown", function(e){
      var open = document.getElementById("reader").classList.contains("on");
      if (e.key === "Escape") { open ? closeReader() : clearFocus(); }
      if (open && e.key === "ArrowRight") openReader(readerIdx + 1);
      if (open && e.key === "ArrowLeft") openReader(readerIdx - 1);
    });
    document.getElementById("readerClose").onclick = closeReader;
    document.getElementById("readerPrev").onclick = function(){ openReader(readerIdx - 1); };
    document.getElementById("readerNext").onclick = function(){ openReader(readerIdx + 1); };
    document.getElementById("reader").addEventListener("click", function(e){
      if (e.target === this) closeReader();
    });
    window.addEventListener("resize", function(){
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      if (composer) composer.setSize(innerWidth, innerHeight);
    });
  }

  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(x, y){
    ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(planes, false);
    return hits.length ? hits[0].object.userData.index : -1;
  }

  function escMeta(it) {
    return (it.author ? "© " + it.author + " · " : "") + (it.license || "");
  }

  var readerIdx = -1;

  function openReader(i){
    if (!items.length) return;
    readerIdx = ((i % items.length) + items.length) % items.length;
    var it = items[readerIdx] || {};
    var img = document.getElementById("readerImg");
    img.src = it.src;
    img.alt = it.title || "";
    (function () {
      var all = items || [];
      var d = window.HSImageDetail ? window.HSImageDetail.build(it, all) : null;
      var box = document.getElementById("readerCap");
      box.classList.add("det");
      if (d) {
        box.innerHTML = d.html;
        var rel = box.querySelectorAll("[data-rel]");
        Array.prototype.forEach.call(rel, function (b, k) {
          b.onclick = function () {
            var target = d.related[k];
            var ni = all.indexOf(target);
            if (ni >= 0) openReader(ni);
          };
        });
      } else {
        box.textContent = (it.title || "") + "　" + (it.desc || "");
      }
    })();

    document.getElementById("reader").classList.add("on"); document.body.classList.add("reader-open");
    focusOn(readerIdx);
  }

  function closeReader(){
    document.getElementById("reader").classList.remove("on"); document.body.classList.remove("reader-open");
    readerIdx = -1;
  }

  /* 点阅读层的空白处也能关闭（readerBackdropClose） */
  (function readerBackdropClose(){
    var r=document.getElementById("reader");
    if(!r) return;
    r.addEventListener("click", function(e){
      if (e.target.closest && e.target.closest("button")) return;   /* 按钮交给原逻辑 */
      if (e.target.tagName === "IMG") return;                       /* 点图不关 */
      closeReader();                                                /* 其余一律关闭 */
    });
  })();

  function focusOn(i){
    focus = i;
    var it = items[i];
    card.querySelector("h3").textContent = it.title || "史料";
    card.querySelector("p").textContent = (it.desc || it.title || "") +
      (it.author ? "　｜　© " + it.author : "") + (it.license ? " · " + it.license : "");
    card.querySelector(".lic").textContent = (it.license || "许可见原页面") + (it.page ? "　·　可核对原始页面" : "");
    card.classList.add("on");
    rot.vel = 0.004;
  }
  function clearFocus(){ focus = -1; card.classList.remove("on"); rot.vel = 0.045; }

  var T0 = performance.now();
  var PULSE = { v: 0 };


  /* ---------- 自动抽卡：从环上抽出一张 → 在空白处展示 → 放回 ---------- */
  var showCase = {
    mesh: null, idx: -1, phase: "idle", t: 0,
    from: new THREE.Vector3(), to: new THREE.Vector3(),
    qFrom: new THREE.Quaternion(), qTo: new THREE.Quaternion(),
    sFrom: 1, sTo: 1, home: null, capEl: null, caption: ""
  };

  function capEl() {
    if (showCase.capEl) return showCase.capEl;
    var el = document.createElement("div");
    el.id = "showcaseCap";
    el.style.cssText = "position:fixed;left:50%;bottom:132px;transform:translateX(-50%);z-index:70;" +
      "max-width:min(760px,86vw);padding:12px 18px;border-radius:6px;text-align:center;" +
      "background:rgba(10,9,8,.86);border:1px solid rgba(201,162,98,.3);backdrop-filter:blur(10px);" +
      "color:#efe5d2;font:13px/1.7 'Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;" +
      "opacity:0;transition:opacity .45s;pointer-events:none";
    document.body.appendChild(el);
    showCase.capEl = el;
    return el;
  }

  function flyOut(i) {
    var m = planes[i];
    if (!m) return;
    showCase.mesh = m;
    showCase.idx = i;
    showCase.phase = "out";
    showCase.t = 0;
    m.userData.showcase = true;

    var world = new THREE.Vector3();
    m.getWorldPosition(world);
    showCase.from.copy(world);
    showCase.qFrom.copy(m.getWorldQuaternion(new THREE.Quaternion()));
    showCase.sFrom.copy ? null : null;
    showCase.sFrom = m.scale.x;

    scene.attach(m);                       // 从环里摘出，保留世界变换

    /* 目标：相机正前方 5.4 处，稍偏下，避开顶部导航 */
    var dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    showCase.to.copy(camera.position).add(dir.multiplyScalar(5.4));
    showCase.to.y -= 0.35;
    showCase.sTo = Math.min(3.2, 1.9 * (showCase.from.distanceTo(camera.position) / 9 + 0.8));

    var cap = capEl();
    var it = m.userData.item || {};
    showCase.caption = (it.title || "") + (it.desc ? "　·　" + it.desc : "");
    cap.textContent = showCase.caption;
  }

  function flyBack() {
    var m = showCase.mesh;
    if (!m) return;
    showCase.phase = "back";
    showCase.t = 0;
    showCase.from.copy(m.position);
    showCase.qFrom.copy(m.quaternion);
    showCase.sFrom = m.scale.x;
    /* 回到环上的位置（按环当前旋转重算世界坐标） */
    var home = showCase.home;
    showCase.to.copy(home.pos);
  }

  function commitBack() {
    var m = showCase.mesh;
    if (!m) return;
    ring.attach(m);
    m.position.copy(showCase.home.localPos);
    m.quaternion.copy(showCase.home.localQuat);
    m.scale.copy(showCase.home.localScale);
    m.userData.showcase = false;
    showCase.mesh = null;
    showCase.phase = "gap";
    showCase.t = 0;
    var cap = capEl();
    cap.style.opacity = "0";
  }

  function showcaseTick(dt) {
    var cap = capEl();
    if (showCase.phase === "idle") {
      if (!planes.length) return;
      var idx = ((window.__showIdx || 0) % planes.length);
      window.__showIdx = idx + 1;
      var m = planes[idx];
      if (m) {
        /* 记住回家用的局部变换 */
        showCase.home = {
          localPos: m.position.clone(),
          localQuat: m.quaternion.clone(),
          localScale: m.scale.clone(),
          pos: m.getWorldPosition(new THREE.Vector3())
        };
        flyOut(idx);
      }
      return;
    }
    if (!showCase.mesh) { showCase.phase = "idle"; return; }

    showCase.t += dt;
    if (showCase.phase === "out") {
      var p1 = Math.min(1, showCase.t / 1.05);
      var e1 = 1 - Math.pow(1 - p1, 3);
      showCase.mesh.position.lerpVectors(showCase.from, showCase.to, e1);
      showCase.mesh.quaternion.slerpQuaternions(showCase.qFrom, new THREE.Quaternion().setFromRotationMatrix(
        new THREE.Matrix4().lookAt(showCase.mesh.position, camera.position, new THREE.Vector3(0, 1, 0))
      ), e1);
      showCase.mesh.scale.setScalar(showCase.sFrom + (showCase.sTo - showCase.sFrom) * e1);
      showCase.mesh.material.opacity = 1;
      if (p1 >= 1) { showCase.phase = "hold"; showCase.t = 0; cap.style.opacity = "1"; }
    } else if (showCase.phase === "hold") {
      /* 轻微悬浮 + 始终面向相机 */
      showCase.mesh.position.y += Math.sin(performance.now() * 0.0016) * 0.0016;
      showCase.mesh.quaternion.setFromRotationMatrix(
        new THREE.Matrix4().lookAt(showCase.mesh.position, camera.position, new THREE.Vector3(0, 1, 0))
      );
      if (showCase.t > 4.2) { cap.style.opacity = "0"; flyBack(); }
    } else if (showCase.phase === "back") {
      var p2 = Math.min(1, showCase.t / 0.95);
      var e2 = p2 * p2 * (3 - 2 * p2);
      showCase.mesh.position.lerpVectors(showCase.from, showCase.to, e2);
      showCase.mesh.scale.setScalar(showCase.sFrom + (showCase.home.localScale.x - showCase.sFrom) * e2);
      if (p2 >= 1) commitBack();
    } else if (showCase.phase === "gap") {
      if (showCase.t > 1.1) showCase.phase = "idle";
    }
  }

  function animate(){
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var now = (performance.now() - T0) / 1000;
    if (!rot.drag) {
      rot.ang += rot.vel * dt * 6;
      if (focus < 0) rot.vel += (0.045 - rot.vel) * 0.02;
    }
    ring.rotation.y = rot.ang;

    /* 每 14 秒一次「俯冲」：镜头猛地前推再拉回，制造穿越感 */
    var cycle = now % 14;
    var dive = 0;
    if (cycle > 9 && cycle < 12.2) {
      var k = (cycle - 9) / 3.2;
      dive = Math.sin(k * Math.PI);          // 0 → 1 → 0
    }
    window.__dive = dive;

    /* 入场：前 2.2 秒环从远处收拢 */
    var intro = Math.min(1, now / 2.2);
    var introEase = 1 - Math.pow(1 - intro, 3);

    /* 星尘缓慢漂移 */
    if (window.__stars) {
      window.__stars.rotation.y += dt * 0.012;
      window.__stars.rotation.x = Math.sin(now * 0.08) * 0.05;
    }

    // 站在环心：四周都是史料墙，缓慢环视
    var look = rot.ang + Math.PI * 0.5;
    var parallaxX = (rot.mx || 0) * 2.4, parallaxY = -(rot.my || 0) * 1.4;
    /* 平滑逼近目标距离 */
    rot.z += (rot.zTarget - rot.z) * 0.09;
    if (window.__zoomHoldUntil && Date.now() < window.__zoomHoldUntil) rot.vel *= 0.90;
    var RING_R = window.__ringRadius || 12;
    /* 用「缩放环本身」实现远近：远看整圈、近看单张，视线始终朝外 */
    /* 环整体缩放：值小=贴脸看单张，值大=退远看整圈 */
    var ringScale = Math.max(0.34, Math.min(3.4, rot.z));
    if (ring) ring.scale.setScalar(ringScale);
    var baseR = RING_R * 0.16;
    var divePush = dive * 9.5;               // 俯冲时向前冲
    var introPull = (1 - introEase) * 26;    // 入场时从远处推近

    camera.position.x = Math.sin(rot.ang * 0.24) * baseR + parallaxX;
    camera.position.y = Math.sin(rot.ang * 0.13) * 0.5 + parallaxY;
    camera.position.z = Math.cos(rot.ang * 0.24) * baseR - divePush + introPull;
    camera.fov = Math.max(48, Math.min(88, 74 - dive * 14));
    camera.updateProjectionMatrix();
    camera.lookAt(Math.sin(look) * 20, 0, Math.cos(look) * 20);

    showcaseTick(dt);

    planes.forEach(function(m, i){
      if (m.userData.showcase) return;   /* 被抽出的那张不参与环上的缩放/透明度逻辑 */
      var d = Math.abs(i - (((focus % planes.length) + planes.length) % planes.length));
      var near = focus >= 0 && Math.min(d, planes.length - d) <= 1;
      var dim = m.userData.dimmed ? 0.06 : 1;

      /* 绕环传播的亮度脉冲 */
      var wave = 0.5 + 0.5 * Math.sin(now * 1.3 - i * 0.16);
      var boost = (focus < 0) ? (0.86 + wave * 0.14) : 1;

      /* 入场：由小到大、由暗到亮 */
      var sIn = 0.55 + 0.45 * Math.min(1, Math.max(0, (intro * 1.8 - (i / planes.length) * 0.8)));
      m.scale.setScalar(sIn);

      m.material.opacity = (focus < 0 ? 0.96 : (near ? 1 : 0.38)) * dim * boost;
      var target = m.userData.baseY + (near ? 0.35 : 0);
      m.position.y += (target - m.position.y) * 0.08;
    });

    if (composer) composer.render(); else renderer.render(scene, camera);
  }

  // 底部罗列带
  function buildStrip(list){
    var track = document.getElementById("track");
    var html = list.map(function(it){
      return '<img src="' + it.src + '" alt="" loading="lazy" title="' + (it.title || "").replace(/"/g, "") + '">';
    }).join("");
    track.innerHTML = html + html;   // 复制一份做无缝滚动
    var x = 0, W = 0;
    function measure(){ W = track.scrollWidth / 2; }
    measure();
    setInterval(measure, 2000);
    (function loop(){
      x -= 0.45;
      if (W && -x >= W) x += W;
      track.style.transform = "translateX(" + x + "px)";
      requestAnimationFrame(loop);
    })();
  }

  /* 主题分组：把 17 个资料目录归并成 7 个可点的主题 */
  var TOPICS = [
    { id: "all", name: "全部", test: function(){ return true; } },
    { id: "figure", name: "形象与雕像", test: function(f){ return /形象|雕像|纪念物/.test(f); } },
    { id: "doc", name: "文献与版本", test: function(f){ return /文献|书籍|档案馆/.test(f); } },
    { id: "scene", name: "场景绘画", test: function(f){ return /宣讲场景|绘画/.test(f); } },
    { id: "place", name: "场地与旧址", test: function(f){ return /场地|旧址|历史地图/.test(f); } },
    { id: "labour", name: "工厂与罢工", test: function(f){ return /工厂|童工|罢工|街垒|工会/.test(f); } },
    { id: "rev", name: "革命与组织", test: function(f){ return /革命|组织|媒介|传播|俄国/.test(f); } },
    { id: "art", name: "馆藏艺术品", test: function(f){ return /克利夫兰|Europeana/.test(f); } }
  ];
  var activeTopic = "all";

  function applyTopic(id){
    activeTopic = id;
    var t = TOPICS.filter(function(x){ return x.id === id; })[0] || TOPICS[0];
    var shown = 0;
    planes.forEach(function(m){
      var it = m.userData.item || {};
      var hit = t.test(it.folder || "");
      m.userData.dimmed = !hit;
      if (hit) shown++;
    });
    Array.prototype.forEach.call(document.querySelectorAll("#filters button"), function(b){
      b.classList.toggle("on", b.getAttribute("data-topic") === id);
    });
    var c1 = document.getElementById("c1");
    if (c1) c1.textContent = String(shown);
  }

  function buildFilters(){
    var box = document.getElementById("filters");
    if (!box) return;
    box.innerHTML = TOPICS.map(function(t, i){
      return '<button type="button" data-topic="' + t.id + '"' + (i === 0 ? ' class="on"' : "") + ">" + t.name + "</button>";
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("button"), function(b){
      b.onclick = function(){ applyTopic(b.getAttribute("data-topic")); };
    });
  }

  fetch("assets/manifests/images.json?v=e3").then(function(r){ return r.json(); }).then(function(data){
    COUNT.images = data.count || (data.items || []).length;
    init();
    buildRing(data);
    buildStrip(data.items || []);
    buildFilters();
    var sl=document.getElementById("stripLabel");
    if(sl) sl.textContent = (data.count||135) + " · 全部史料与页面逐张罗列";
    animateCount(document.getElementById("c1"), COUNT.images, 1600);
  }).catch(function(e){
    document.body.insertAdjacentHTML("beforeend",
      '<p style="position:fixed;inset:auto 0 40%;text-align:center;color:#a8332c">数据加载失败：' + e.message + "</p>");
  });

  fetch("assets/manifests/registry.json").then(function(r){ return r.json(); }).then(function(d){
    var it = d.items || d;
    COUNT.assets = it.length;
    COUNT.models = it.filter(function(x){ return (x.kind || x.type) === "model"; }).length;
    COUNT.docs = it.filter(function(x){ return (x.kind || x.type) === "document"; }).length;
    animateCount(document.getElementById("c2"), COUNT.models, 1800);
    animateCount(document.getElementById("c3"), COUNT.docs, 2000);
    animateCount(document.getElementById("c4"), COUNT.assets, 2200);
  }).catch(function(){});
})();
</script>
