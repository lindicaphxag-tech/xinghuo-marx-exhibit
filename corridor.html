<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<title>走廊 · 星火与道路</title>
<script src="js/file-guard.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;overflow:hidden}
  body{font-family:"Microsoft YaHei",system-ui,sans-serif;background:#0a0605;color:#f0e2c8;height:100vh;width:100vw}
  /* 3D 场景 */
  .scene3d{position:absolute;inset:0;perspective:1200px;perspective-origin:50% 45%}
  .hall{position:absolute;left:50%;top:50%;width:0;height:0;
    transform-style:preserve-3d;transition:transform .6s cubic-bezier(.22,.9,.3,1)}
  /* 地面与天花 */
  .floor,.ceiling{position:absolute;left:-600px;top:-400px;width:1200px;height:2000px;
    background:linear-gradient(180deg,#1a0f0a,#0a0605);transform:rotateX(90deg);}
  .floor{transform:rotateX(90deg) translateZ(300px);
    background:
      repeating-linear-gradient(90deg, rgba(180,140,80,.08) 0 2px, transparent 2px 60px),
      linear-gradient(180deg,#2a1810,#0a0605);}
  .ceiling{transform:rotateX(90deg) translateZ(-300px);background:#0a0605}
  /* 左右墙 */
  .wall{position:absolute;left:-600px;top:-300px;width:1200px;height:600px;
    background:linear-gradient(90deg,#1f120c,#2a1810 50%,#1f120c);}
  .wall.left{transform:rotateY(90deg) translateZ(600px)}
  .wall.right{transform:rotateY(-90deg) translateZ(600px)}
  /* 门 */
  .door{position:absolute;width:140px;height:220px;
    background:linear-gradient(180deg,#3a2015,#1a0e08);
    border:2px solid #8a6030;border-radius:6px 6px 0 0;
    display:flex;flex-direction:column;justify-content:flex-end;
    padding:14px;cursor:pointer;text-decoration:none;color:#f0e2c8;
    transition:border-color .3s, box-shadow .3s;
    box-shadow:inset 0 0 30px rgba(0,0,0,.7)}
  .door:hover{border-color:#e8a040;box-shadow:0 0 30px rgba(232,160,64,.4), inset 0 0 30px rgba(0,0,0,.7)}
  .door .num{font-size:10px;color:#b3202a;letter-spacing:2px;font-weight:700}
  .door h3{font-size:14px;margin:6px 0 4px;color:#fff;line-height:1.3}
  .door p{font-size:10px;color:#a08060;line-height:1.4}
  .door .light{position:absolute;top:-10px;left:50%;width:8px;height:8px;border-radius:50%;
    background:#ffd27a;box-shadow:0 0 20px 8px rgba(255,210,120,.5)}
  /* HUD */
  .hud{position:fixed;left:0;right:0;z-index:10;color:#e8d0a8}
  .hud.top{top:20px;text-align:center;pointer-events:none}
  .hud.top h1{font-size:22px;font-weight:700;letter-spacing:3px;text-shadow:0 2px 12px #000}
  .hud.top .q{font-size:13px;color:#c8a878;margin-top:6px}
  .hud.bottom{bottom:20px;text-align:center;font-size:12px;color:#a08060}
  .hud.bottom kbd{background:#2a1810;border:1px solid #604020;border-radius:4px;
    padding:2px 8px;font-family:inherit;margin:0 4px;color:#e8d0a8}
  .exit{position:fixed;top:18px;right:18px;z-index:11;color:#c8a878;text-decoration:none;
    font-size:12px;border:1px solid #604020;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.4)}
  .exit:hover{color:#fff;border-color:#e8a040}
</style>
<link rel="stylesheet" href="css/ui-v3.css?v=2">
<link rel="stylesheet" href="css/unify.css?v=1">
</head>
<body>
<div class="scene3d">
  <div class="hall" id="hall">
    <div class="floor"></div>
    <div class="ceiling"></div>
    <div class="wall left"></div>
    <div class="wall right"></div>
    <!-- 门由 JS 生成，左右交替沿 Z 轴排列 -->
  </div>
</div>

<div class="hud top">
  <h1>走 廊 · 九 扇 门</h1>
      <p class="eyebrow">自由探索 · 从走廊选一扇门进去</p>
  <div class="q">向前走，选一扇门推开——每一扇通向一个历史现场。</div>
</div>
<a class="exit" href="index.html">跳过走廊，直接进叙事 →</a>
<div class="hud bottom">
  <kbd>拖拽</kbd> 或 <kbd>↑/↓</kbd> 或 <kbd>滚轮</kbd> 前进后退 · 点击门进入 · <kbd>Esc</kbd> 回入口
</div>

<script>
(function(){
  var DOORS = [
    { t:"叙事主线", d:"10 卷主题展区与纪念终章", href:"index.html", side:"L" },
    { t:"阅览室", d:"大英博物馆 1850", href:"reading-room-panorama.html", side:"R" },
    { t:"1848 街垒", d:"巴黎圣马丁运河", href:"scenes.html", side:"L" },
    { t:"肯宁顿公地", d:"宪章运动 1848", href:"scenes.html", side:"R" },
    { t:"印刷所", d:"第一国际 1864", href:"scenes.html", side:"L" },
    { t:"市政厅", d:"巴黎 1871 前", href:"scenes.html", side:"R" },
    { t:"毛纺厂", d:"Mytholme 遗址", href:"scenes.html", side:"L" },
    { t:"织布局", d:"上海机器织布局", href:"scenes.html", side:"R" },
    { t:"斯莫尔尼", d:"1917 花坛", href:"smolny-panorama.html", side:"L" }
  ];
  var hall = document.getElementById("hall");
  var spacing = 280; // 每扇门间隔
  DOORS.forEach(function(d, i){
    var a = document.createElement("a");
    a.className = "door";
    a.href = d.href;
    var z = 400 - i * spacing;
    if (d.side === "L") {
      a.style.transform = "translateZ(" + z + "px) rotateY(90deg) translateX(-530px)";
    } else {
      a.style.transform = "translateZ(" + z + "px) rotateY(-90deg) translateX(530px)";
    }
    a.innerHTML = '<div class="light"></div><div class="num">ROOM ' + String(i+1).padStart(2,"0") + '</div>' +
      '<h3>' + d.t + '</h3><p>' + d.d + '</p>';
    hall.appendChild(a);
  });

  /* 前进后退控制：translateZ 相机 dolly */
  var posZ = 0;          // 当前相机前进量（负值=向前走）
  var targetZ = 0;
  var minZ = -(DOORS.length - 1) * spacing - 200;
  var maxZ = 200;
  function render(){
    posZ += (targetZ - posZ) * 0.08;
    hall.style.transform = "translateZ(" + posZ + "px)";
    requestAnimationFrame(render);
  }
  function go(delta){ targetZ = Math.max(minZ, Math.min(maxZ, targetZ + delta)); }
  render();

  /* 滚轮 */
  window.addEventListener("wheel", function(e){ go(e.deltaY * 0.5); }, {passive:true});
  /* 键盘 */
  window.addEventListener("keydown", function(e){
    if (e.key === "ArrowDown" || e.key === "ArrowRight") go(60);
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") go(-60);
  });
  /* 拖拽 */
  var dragging = false, startY = 0, startTarget = 0;
  window.addEventListener("mousedown", function(e){ dragging = true; startY = e.clientY; startTarget = targetZ; });
  window.addEventListener("mousemove", function(e){ if(dragging) targetZ = Math.max(minZ, Math.min(maxZ, startTarget + (e.clientY - startY) * 1.2)); });
  window.addEventListener("mouseup", function(){ dragging = false; });
  /* 触摸 */
  var tY = 0, tTarget = 0;
  window.addEventListener("touchstart", function(e){ tY = e.touches[0].clientY; tTarget = targetZ; });
  window.addEventListener("touchmove", function(e){ targetZ = Math.max(minZ, Math.min(maxZ, tTarget + (e.touches[0].clientY - tY) * 1.5)); }, {passive:true});
})();
</script>
<script src="js/back.js?v=1"></script>
</body>
</html>
