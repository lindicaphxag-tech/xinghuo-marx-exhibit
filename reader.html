<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文献阅读室 · 可翻页的书页</title>
<style>
  :root{--bg:#f4efe6;--panel:#fffdf8;--ink:#1b1814;--dim:#6e675d;--line:#ddd5c7;--red:#a8342a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
  header{padding:22px 30px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:19px}
  h1 span{color:var(--red)}
  .sub{color:var(--dim);font-size:13px}
  a{color:var(--red);text-decoration:none}
  main{display:grid;grid-template-columns:250px minmax(0,1fr);gap:0;min-height:calc(100vh - 150px)}
  @media(max-width:860px){main{grid-template-columns:1fr}}
  nav{border-right:1px solid var(--line);padding:14px 10px;max-height:calc(100vh - 96px);overflow-y:auto}
  nav button{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:4px;
    background:none;font:inherit;font-size:13px;color:var(--dim);cursor:pointer;line-height:1.4}
  nav button:hover{background:#ece4d6;color:var(--ink)}
  nav button.on{background:var(--red);color:#fff}
  nav button small{display:block;font-size:11px;opacity:.7;margin-top:2px}
  section{padding:22px 28px 60px}
  .doc-head{display:flex;gap:22px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
  .doc-cover{width:120px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fff}
  .doc-cover img{display:block;width:100%}
  .doc-meta h2{margin:0 0 6px;font-size:17px}
  .doc-meta p{margin:0;color:var(--dim);font-size:13px}
  .viewer{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:14px;
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .viewer img{max-width:100%;max-height:62vh;display:block;box-shadow:0 2px 14px rgba(0,0,0,.12)}
  .controls{display:flex;gap:10px;align-items:center}
  .controls button{padding:7px 14px;border:1px solid var(--line);background:#fff;border-radius:4px;
    font:inherit;font-size:13px;cursor:pointer}
  .controls button:hover{border-color:var(--red);color:var(--red)}
  .controls button:disabled{opacity:.35;cursor:default}
  .pageno{font-size:13px;color:var(--dim);min-width:88px;text-align:center}
  .thumbs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .thumbs button{padding:0;border:2px solid transparent;background:none;cursor:pointer;border-radius:3px;overflow:hidden}
  .thumbs button.on{border-color:var(--red)}
  .thumbs img{display:block;width:56px;height:76px;object-fit:cover}
  .empty{padding:40px;color:var(--dim);text-align:center}
  footer{padding:12px 30px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}

  .osd-frame{width:100%;height:min(72vh,760px);background:#111;border:1px solid rgba(0,0,0,.3)}
  .osd-frame img{max-width:100%}
</style>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/ui-v3.css?v=2">
</head>
<body>
<header>
  <h1>文献阅读室 <span>·</span> 可翻页的书页</h1>
  <div class="sub">9 种公版书刊 · 每册 3 页原扫描｜来源 Internet Archive｜<a href="index.html">← 主展馆</a></div>
</header>
<main>
  <nav id="list"></nav>
  <section>
    <div id="doc"></div>
  </section>
</main>
<footer>书页为 Internet Archive 公版扫描件的低分辨率副本，仅用于展陈示意；原文请按记录中的链接回源核对。</footer>
<script src="assets/vendor/osd/openseadragon.min.js"></script>
<script>
(function(){
  "use strict";
  var DATA=null, cur=-1, page=0;
  var listEl=document.getElementById("list"), docEl=document.getElementById("doc");

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function renderNav(){
    DATA.items.forEach(function(it,i){
      var b=document.createElement("button");
      b.innerHTML=esc(it.title)+"<small>"+(it.year||"")+" · "+it.pages.length+" 页</small>";
      b.onclick=function(){
        cur=i; page=0;
        Array.prototype.forEach.call(listEl.children,function(x, k){ x.classList.toggle("on", k===i); });
        renderDoc();
      };
      if(i===0) b.classList.add("on");
      listEl.appendChild(b);
    });
  }

  function renderDoc(){
    if(window.__osd){ try{window.__osd.destroy();}catch(e){} window.__osd=null; }
    var it=DATA.items[cur];
    docEl.innerHTML=
      '<div class="doc-head"><div class="doc-cover"><img src="'+esc(it.cover)+'" alt=""></div>'+
      '<div class="doc-meta"><h2>'+esc(it.title)+'</h2><p>'+esc(it.credit)+'</p><p>'+esc(it.desc)+'</p></div></div>'+
      '<div class="viewer"><div id="osd" class="osd-frame"></div>'+
      '<div class="controls"><button id="prev">← 上一页</button>'+
      '<span class="pageno" id="pageno"></span>'+
      '<button id="next">下一页 →</button></div>'+
      '<div class="thumbs" id="thumbs"></div></div>';
    var prev=document.getElementById("prev"), next=document.getElementById("next");
    var thumbs=document.getElementById("thumbs");
    it.pages.forEach(function(u,k){
      var b=document.createElement("button");
      b.innerHTML='<img src="'+esc(u)+'" alt="">';
      if(k===page) b.classList.add("on");
      b.onclick=function(){ page=k; update(); };
      thumbs.appendChild(b);
    });
    prev.onclick=function(){ if(page>0){page--; update();} };
    next.onclick=function(){ if(page<it.pages.length-1){page++; update();} };
window.__osd = window.__osd || null;
function showPage(src){
  if(!window.OpenSeadragon){ var el0=document.getElementById("osd"); if(el0){el0.innerHTML='<img src="'+src+'" style="max-width:100%">';} return; }
  var el=document.getElementById("osd");
  if(!el) return;
  if(window.__osd){ try{window.__osd.destroy();}catch(e){} window.__osd=null; }
  el.innerHTML="";
  window.__osd=OpenSeadragon({ id:"osd", prefixUrl:"assets/vendor/osd/images/",
    showNavigationControl:false, showNavigator:true, navigatorPosition:"BOTTOM_RIGHT",
    gestureSettingsMouse:{ scrollToZoom:true, clickToZoom:false, dblClickToZoom:true },
    maxZoomPixelRatio:4, visibilityRatio:0.6, constrainDuringPan:true,
    tileSources:{ type:"image", url:src } });
}

function update(){
      showPage(it.pages[page]);
      document.getElementById("pageno").textContent=(page+1)+" / "+it.pages.length;
      prev.disabled=page===0; next.disabled=page===it.pages.length-1;
      Array.prototype.forEach.call(thumbs.children,function(x,k){ x.classList.toggle("on",k===page); });
    }
    update();
  }

  fetch("assets/manifests/pages.json").then(function(r){return r.json();}).then(function(d){
    DATA=d;
    if(!d.items || !d.items.length){ docEl.innerHTML='<div class="empty">没有可翻页的文献</div>'; return; }
    renderNav();
    // ?doc=xxx 深链：从时空穿梭或档案页直接打开指定文献
    var want=new URLSearchParams(location.search).get("doc");
    cur=0;
    if(want){
      d.items.forEach(function(it,k){ if(it.id===want) cur=k; });
    }
    renderDoc();
    if(want){ Array.prototype.forEach.call(listEl.children,function(x,k){ x.classList.toggle("on",k===cur); }); }
  }).catch(function(e){
    docEl.innerHTML='<div class="empty">pages.json 加载失败：'+esc(e.message)+"</div>";
  });
})();
</script>
<script src="js/ui-chrome.js?v=2"></script>
<script src="js/back.js?v=1"></script>
</body>
</html>
